name: etl-agent
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: etl
      POSTGRES_DB: etl_control
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_local.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U etl -d etl_control"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.5-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://etl:${POSTGRES_PASSWORD}@postgres:5432/etl_control
      REDIS_URL: redis://redis:6379/0
      BOOTSTRAP_DIR: /run/identity
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./.runtime:/run/identity
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
